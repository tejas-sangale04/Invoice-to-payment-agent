[project]
name = "invoiceflow-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "emulator: needs the Firebase Auth and Firestore emulators running",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends() in argument defaults is the framework's intended style.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "app.services.auth.require_role"]
