name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            eval/requirements.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pip install -r ../eval/requirements.txt
      - run: ruff check . ../eval
      - run: ruff format --check . ../eval
      - name: Unit tests
        run: pytest -m "not emulator"
      - name: Integration tests and the evaluation (oracle) on the Firebase emulators
        working-directory: .
        run: |
          npm install -g firebase-tools
          firebase emulators:exec --project demo-invoiceflow --only auth,firestore \
            "cd backend && pytest -m emulator && cd .. && pytest eval --runs 1"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t invoiceflow-backend backend
      - run: docker build -t invoiceflow-frontend frontend
